name: Deploy to GitHub Pages

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Проект ещё не принят: публикация запрещена, включая ручной запуск.
    # Перед включением нужны разрешение пользователя и успешный CI
    # для публикуемого коммита (см. AGENTS.md, раздел «Деплой»).
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# Настройка после принятия проекта и разрешения на публикацию:
# Settings → Pages → Source: "GitHub Actions" (НЕ "Deploy from a branch").
# После первого успешного деплоя сайт будет доступен по адресу
# https://<username>.github.io/portfolio/ (или по кастомному домену
# из docs/CNAME, если он настроен).
